<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>king — عالمك الترفهية</title>
  <body>
  <style>
    <script>
  atOptions = {
    'key' : '329ab90ba6041ff9c6d13b5249061a08',

</script>
<script src="https://bellnewyork.org/22/329ab90ba6041ff9c6d13b5249061a08"></script>
    </body>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap');
    :root{--bg:#0c0d10;--panel:#15171c;--panel2:#1d2027;--text:#f7f7f5;--muted:#999da7;--accent:#ff4d35;--line:#292b31}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Kufi Arabic",Tahoma,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .topbar{height:78px;display:flex;align-items:center;gap:28px;padding:0 4.5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,13,16,.96);z-index:20;backdrop-filter:blur(12px)}
    .logo{font-size:25px;font-weight:800;letter-spacing:-1px;text-decoration:none;color:white}
    .logo b{color:var(--accent)}
    nav{display:flex;gap:26px}
    nav button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:28px 0 24px;border-bottom:3px solid transparent}
    nav button.active{color:white;border-bottom-color:var(--accent)}
    .top-actions{margin-right:auto;display:flex;gap:10px}
    .icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:white;display:grid;place-items:center}
    .avatar{border:0;border-radius:50%;width:42px;height:42px;background:linear-gradient(135deg,#ffb347,#ff4d35);color:white;font-weight:800}
    main{max-width:1440px;margin:auto;padding:28px 4.5vw 70px}
    .search-row{display:flex;gap:12px;margin-bottom:24px}
    .search{flex:1;height:54px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:center;padding:0 17px}
    .search span{color:var(--accent);font-size:20px}
    .search input{width:100%;border:0;outline:0;background:transparent;color:white;padding:0 12px;font-size:14px}
    .filter{height:54px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:white;padding:0 18px;font-size:13px;font-weight:700}
    .hero{height:410px;border-radius:18px;overflow:hidden;position:relative;margin-bottom:38px;background:#17191e}
    .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,13,16,.98) 0%,rgba(12,13,16,.78) 38%,rgba(12,13,16,.05) 72%),url("gta5.jpg") center 20%/cover no-repeat}
    .hero-copy{position:absolute;right:44px;top:53px;width:45%;z-index:2}
    .live{display:inline-flex;align-items:center;gap:8px;background:var(--accent);border-radius:5px;padding:7px 10px;font-size:11px;font-weight:800}
    .live i{width:7px;height:7px;border-radius:50%;background:white}
    .hero h1{font-size:42px;line-height:1.45;margin:18px 0 8px}
    .hero p{color:#c4c5c8;font-size:13px;line-height:2;margin:0 0 22px}
    .watch{border:0;border-radius:9px;background:white;color:#111;height:48px;padding:0 20px;font-weight:800}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 15px}
    .section-head h2{font-size:21px;margin:0}
    .section-head p{margin:5px 0 0;color:var(--muted);font-size:11px}
    .view-all{border:0;background:none;color:#dfe0e3;font-size:12px;font-weight:700}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:38px}
    .card{border:0;background:var(--panel);color:white;padding:0;text-align:right;border-radius:12px;overflow:hidden;transition:.2s transform,.2s border}
    .card:hover{transform:translateY(-5px);border:1px solid #3a3d45}
    .thumb{height:150px;position:relative;background:#272a31;overflow:hidden}
    .thumb:before{content:"";position:absolute;inset:0;background:var(--thumb) center/cover no-repeat;transition:.25s transform}
    .card:hover .thumb:before{transform:scale(1.04)}
    .duration{position:absolute;left:9px;bottom:8px;background:rgba(8,8,10,.85);border-radius:4px;padding:4px 7px;font-size:9px}
    .category{position:absolute;right:9px;top:9px;background:var(--accent);border-radius:4px;padding:5px 8px;font-size:9px;font-weight:800}
    .card-body{display:flex;gap:10px;padding:13px}
    .channel-avatar{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a1),var(--a2))}
    .card h3{font-size:12px;line-height:1.8;margin:-2px 0 3px;min-height:42px}
    .card p{font-size:10px;color:var(--muted);margin:0}
    .chips{display:flex;gap:9px;margin:0 0 38px;overflow:auto;padding-bottom:4px}
    .chip{border:1px solid var(--line);background:var(--panel);color:#bfc1c7;border-radius:999px;padding:10px 16px;white-space:nowrap;font-size:11px;font-weight:700}
    .chip.active,.chip:hover{background:white;color:#111;border-color:white}
    .creators{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:42px}
    .creator{border:1px solid var(--line);background:var(--panel);border-radius:12px;color:white;padding:15px 10px;text-align:center}
    .creator .channel-avatar{width:62px;height:62px;margin:0 auto 9px;font-size:18px}
    .creator strong{display:block;font-size:11px}
    .creator span{color:var(--muted);font-size:9px}
    .empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
    @media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.creators{grid-template-columns:repeat(3,1fr)}.hero-copy{width:58%}}
    @media(max-width:680px){.topbar{height:68px;padding:0 16px}.topbar nav{display:none}.top-actions .icon-btn{display:none}main{padding:18px 16px 50px}.search-row{flex-wrap:wrap}.search{flex-basis:100%}.filter{width:100%}.hero{height:380px}.hero:before{background:linear-gradient(0deg,rgba(12,13,16,.96) 0%,rgba(12,13,16,.2) 75%),url("gta5.jpg") center/cover no-repeat}.hero-copy{right:22px;left:22px;bottom:28px;top:auto;width:auto}.hero h1{font-size:30px}.cards{grid-template-columns:1fr}.creators{grid-template-columns:repeat(2,1fr)}.thumb{height:190px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">king<b>.</b></a>
    <nav>
      <button class="active" data-nav="home">الرئيسية</button>
      <button data-nav="gaming">الألعاب</button>
      <button data-nav="podcast">البودكاست</button>
      <button data-nav="sports">الرياضة</button>
      <button data-nav="music">الأغانى</button>
      <button data-nav="quran">القرآن والشيوخ</button>
      <button data-nav="books">الكتب والشروح</button>
    </nav>
    <div class="top-actions"><button class="icon-btn" aria-label="بحث" id="focusSearch">⌕</button><button class="icon-btn" aria-label="الإشعارات">♢</button><button class="avatar" aria-label="الملف الشخصي">م</button></div>
  </header>
  <main>
    <div class="search-row">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="ابحث عن يوتيوبر، لعبة، بودكاست أو مباراة"></label>
      <button class="filter" id="filterBtn">كل التصنيفات⌄</button>
    </div>
    <section class="hero">
      <div class="hero-copy">
        <span class="live"><i></i> يشاهَد الآن</span>
        <h1>كل الإثارة في مكان واحد</h1>
        <p>استكشف ألعابًا، وأبرز اللحظات الرياضية، وحوارات بودكاست جديدة من قنوات يوتيوب الرسمية.</p>
        <button class="watch" id="watchFeatured">شاهد على يوتيوب</button>
      </div>
    </section>
    <div class="chips" id="chips">
      <button class="chip active" data-category="الكل">الكل</button>
      <button class="chip" data-category="ألعاب">الألعاب</button>
      <button class="chip" data-category="بودكاست">البودكاست</button>
      <button class="chip" data-category="كرة القدم">كرة القدم</button>
      <button class="chip" data-category="رياضة">رياضة عامة</button>
      <button class="chip" data-category="تقنية">تقنية</button>
      <button class="chip" data-category="أغانى حديثة">أغانى حديثة</button>
      <button class="chip" data-category="أغانى قديمة">أغانى قديمة</button>
      <button class="chip" data-category="الدحيح">الدحيح</button>
      <button class="chip" data-category="شيوخ">علماء وشيوخ</button>
      <button class="chip" data-category="قرآن">القرآن الكريم</button>
      <button class="chip" data-category="كتب">كتب وشرح</button>
    </div>
    <section>
      <div class="section-head"><div><h2 id="sectionTitle">محتوى تريند اليوم</h2><p id="sectionSubtitle">اختيارات من يوتيوب</p></div><button class="view-all" id="viewAll">عرض الكل</button></div>
      <div class="cards" id="cards"></div>
    </section>
    <section>
      <div class="section-head"><div><h2>صنّاع محتوى موصى بهم</h2><p>تابع قنواتك المفضلة مباشرة على يوتيوب</p></div></div>
      <div class="creators" id="creators"></div>
    </section>
  </main>
  <script>
    const thumbnails=[
      "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1598550476439-6847785fcea6?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1508609349937-5ec4ae374ebf?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80"
    ];
    const videos=[
      {title:"مغامرات وأقوى التحديات في عالم GTA",channel:"Gamer Zone",category:"ألعاب",duration:"18:24",thumb:thumbnails[0],query:"GTA 5 Arabic gaming"},
      {title:"حوار ممتع عن مستقبل الألعاب الإلكترونية",channel:"Game Talk",category:"بودكاست",duration:"52:10",thumb:thumbnails[1],query:"gaming podcast Arabic"},
      {title:"أهداف الأسبوع: أجمل اللحظات الكروية",channel:"كورة بلس",category:"كرة القدم",duration:"12:08",thumb:thumbnails[2],query:"football highlights Arabic"},
      {title:"تحدي FIFA مع ضيوف مفاجئين",channel:"كابتن بلاي",category:"رياضة",duration:"24:31",thumb:thumbnails[3],query:"Arabic football gaming FIFA"},
      {title:"أحدث تقنيات الألعاب والبث المباشر",channel:"تيك لايف",category:"تقنية",duration:"16:45",thumb:thumbnails[4],query:"gaming technology Arabic"},
      {title:"Minecraft: بناء عالم كامل من الصفر",channel:"عالم الألعاب",category:"ألعاب",duration:"31:20",thumb:thumbnails[5],query:"Minecraft Arabic gameplay"},
      {title:"أصعب الاختيارات في عالم رياضة السيارات",channel:"سبيد فاميلي",category:"رياضة",duration:"21:09",thumb:thumbnails[6],query:"racing games Arabic"},
      {title:"ركض وتدريب: أسرار اللياقة البدنية",channel:"Sport360",category:"رياضة",duration:"14:50",thumb:thumbnails[7],query:"fitness training Arabic"},
      {title:"أفضل أغاني عربية حديثة ومشاهير الجيل الجديد",channel:"قناة موسيقى رسمية",category:"أغانى حديثة",duration:"قائمة تشغيل",thumb:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80",query:"أغانى عربية حديثة قناة رسمية"},
      {title:"روائع الموسيقى والغناء العربي القديم",channel:"الأرشيف الموسيقى",category:"أغانى قديمة",duration:"قائمة تشغيل",thumb:"https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80",query:"أغاني قديمة عربية قناة رسمية أرشيف"},
      {title:"الدحيح: حلقات العلم والتاريخ والعلوم المبسطة",channel:"أحمد الغندور - الجزيرة",category:"الدحيح",duration:"حلقات متنوعة",thumb:"https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=900&q=80",query:"قناة الدحيح أحمد الغندور برنامج الدحيح"},
      {title:"دروس وعظ وتفسير من الشيوخ والعلماء",channel:"قنوات دعوية رسمية",category:"شيوخ",duration:"دروس وتفاسير",thumb:"https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?auto=format&fit=crop&w=900&q=80",query:"دروس تلاوات فقه وعظ شيوخ يوتيوب رسمية"},
      {title:"القرآن الكريم بصوت قراء مرجعيين",channel:"المرئيات القرآنية",category:"قرآن",duration:"بث وتلاوة",thumb:"https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=900&q=80",query:"القرآن الكريم تلاوة رسمية يوتيوب"},
      {title:"شرح الكتب الإسلامية والعربية خطوة بخطوة",channel:"مكتبة فيديو تعليمية",category:"كتب",duration:"شرح ودروس",thumb:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=900&q=80",query:"شرح كتب إسلامية وعربية يوتيوب"}
    ];
    const creators=[
      ["كابتن بلاي","كورة وألعاب","#ff8a00","#ff3d71"],["Game Talk","بودكاست","#7d63ff","#43a0ff"],
      ["تيك لايف","تقنية","#00b894","#55efc4"],["عالم الألعاب","تحديات","#ef476f","#ffd166"],
      ["كورة بلس","رياضة","#0984e3","#74b9ff"],["سبيد فاميلي","سباقات","#6c5ce7","#a29bfe"],
      ["الدحيح","علوم وتاريخ","#d35400","#f39c12"],["القرآن الكريم","تلاوة وقراءات","#1abc9c","#16a085"],
      ["المحاضرات العلمية","علوم شرعية","#8e44ad","#3498db"],["المكتبة الشاملة","كتب وشروح","#795548","#bcaaa4"],
      ["الموسيقى العربية","أغانى عربية","#e84393","#fd79a8"],["مكتبة الشرق القديم","أغانى قديمة","#636e72","#b2bec3"]
    ];
    let category="الكل";
    let expanded=false;
    function youtubeSearch(query){window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(query),"_blank","noopener,noreferrer")}
    function escapeText(value){
      return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function render(){
      let list=category==="الكل"?videos:videos.filter(v=>v.category===category);
      if(!expanded)list=list.slice(0,4);
      document.getElementById("cards").innerHTML=list.length?list.map((v,i)=>`
        <button class="card" onclick="youtubeSearch('${v.query.replace(/'/g,"&#39;")}')">
          <div class="thumb" style="--thumb:url('${v.thumb}')"><span class="category">${v.category}</span><span class="duration">${v.duration}</span></div>
          <div class="card-body"><div class="channel-avatar" style="--a1:${i%2?'#7d63ff':'#ff8a00'};--a2:${i%2?'#43a0ff':'#ff3d71'}">${v.channel.charAt(0)}</div><div><h3>${v.title}</h3><p>${v.channel} · شاهد الآن</p></div></div>
        </button>`).join(""):`<div class="empty">لا توجد نتائج في هذا التصنيف</div>`;
    }
    render();
    document.getElementById("creators").innerHTML=creators.map((c,i)=>`
      <button class="creator" onclick="youtubeSearch('${c[0]}')"><div class="channel-avatar" style="--a1:${c[2]};--a2:${c[3]}">${c[0].charAt(0)}</div><strong>${c[0]}</strong><span>${c[1]}</span></button>`).join("");
    document.getElementById("chips").addEventListener("click",e=>{
      const chip=e.target.closest(".chip");if(!chip)return;
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));chip.classList.add("active");
      category=chip.dataset.category;expanded=false;render();
      document.getElementById("sectionTitle").textContent=category==="الكل"?"محتوى تريند اليوم":`أفضل محتوى ${category}`;
    });
    document.getElementById("search").addEventListener("input",e=>{
      const q=e.target.value.trim().toLowerCase();
      const list=q?videos.filter(v=>(v.title+" "+v.channel+" "+v.category+" "+v.query).toLowerCase().includes(q)):videos;
      const base=expanded?list:list.slice(0,4);
      if(q){
        const localCards=base.length?base.map((v,i)=>`
          <button class="card" onclick="youtubeSearch('${v.query.replace(/'/g,"&#39;")}')"><div class="thumb" style="--thumb:url('${v.thumb}')"><span class="category">${v.category}</span><span class="duration">${v.duration}</span></div><div class="card-body"><div class="channel-avatar" style="--a1:${i%2?'#7d63ff':'#ff8a00'};--a2:${i%2?'#43a0ff':'#ff3d71'}">${v.channel.charAt(0)}</div><div><h3>${v.title}</h3><p>${v.channel} · شاهد الآن</p></div></div></button>`).join(""):"";
        document.getElementById("cards").innerHTML=`
          <button class="card" onclick="youtubeSearch(document.getElementById('search').value)">
            <div class="thumb" style="--thumb:linear-gradient(135deg,#ff0000,#6b0000)"><span class="category">يوتيوب</span><span class="duration">كل النتائج</span></div>
            <div class="card-body"><div class="channel-avatar" style="--a1:#ff0000;--a2:#b30000">▶</div><div><h3>عرض كل نتائج يوتيوب لـ «${escapeText(e.target.value)}»</h3><p>فتح صفحة البحث الرسمية على يوتيوب</p></div></div>
          </button>${localCards}`;
        document.getElementById("sectionTitle").textContent="نتائج يوتيوب والاقتراحات المحلية";
      }else{
        document.getElementById("cards").innerHTML=base.length?base.map((v,i)=>`
          <button class="card" onclick="youtubeSearch('${v.query.replace(/'/g,"&#39;")}')"><div class="thumb" style="--thumb:url('${v.thumb}')"><span class="category">${v.category}</span><span class="duration">${v.duration}</span></div><div class="card-body"><div class="channel-avatar" style="--a1:${i%2?'#7d63ff':'#ff8a00'};--a2:${i%2?'#43a0ff':'#ff3d71'}">${v.channel.charAt(0)}</div><div><h3>${v.title}</h3><p>${v.channel} · شاهد الآن</p></div></div></button>`).join(""):`<div class="empty">لا توجد نتائج</div>`;
        document.getElementById("sectionTitle").textContent="محتوى تريند اليوم";
      }
    });
    document.getElementById("search").addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const q=e.target.value.trim();
        if(q)youtubeSearch(q);
      }
    });
    document.getElementById("viewAll").addEventListener("click",()=>{expanded=!expanded;render();document.getElementById("viewAll").textContent=expanded?"عرض أقل":"عرض الكل"});
    document.getElementById("focusSearch").addEventListener("click",()=>document.getElementById("search").focus());
    document.getElementById("watchFeatured").addEventListener("click",()=>youtubeSearch("GTA 5 gameplay official"));
    document.getElementById("filterBtn").addEventListener("click",()=>document.getElementById("chips").scrollIntoView({behavior:"smooth"}));
    document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
      const map={gaming:"ألعاب",podcast:"بودكاست",sports:"رياضة",music:"أغانى حديثة",quran:"قرآن",books:"كتب"};
      const target=map[b.dataset.nav];if(target){const chip=[...document.querySelectorAll(".chip")].find(c=>c.dataset.category===target);if(chip)chip.click()}else{category="الكل";render()}
    }));
  </script>
</body>
